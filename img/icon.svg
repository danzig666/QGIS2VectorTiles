<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="qgreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93B023"/>
      <stop offset="0.55" stop-color="#6FA431"/>
      <stop offset="1" stop-color="#4F8F33"/>
    </linearGradient>
    <clipPath id="mapClip">
      <rect x="258" y="388" width="418" height="228" rx="18"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="7" result="off"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Q ring: strong enough to remain readable at 24-32 px -->
  <circle cx="458" cy="458" r="334"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="102"/>
  <circle cx="458" cy="458" r="334"
          fill="none" stroke="url(#qgreen)" stroke-width="78"/>

  <!-- Q tail turned into a publish/export arrow -->
  <path d="M 628 628 L 815 815"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.92"
        stroke-width="102" stroke-linecap="round"/>
  <path d="M 628 628 L 815 815"
        fill="none" stroke="url(#qgreen)"
        stroke-width="78" stroke-linecap="round"/>
  <!-- Solid arrow head, deliberately oversized so the action survives toolbar scaling -->
  <path d="M 890 890 L 772 852 L 852 772 Z"
        fill="#FFFFFF" fill-opacity="0.94" stroke="#FFFFFF" stroke-width="22"
        stroke-linejoin="round"/>
  <path d="M 873 873 L 791 846 L 846 791 Z"
        fill="#4F8F33" stroke="#4F8F33" stroke-width="12"
        stroke-linejoin="round"/>

  <!-- Browser / web viewer -->
  <g filter="url(#softShadow)">
    <rect x="232" y="287" width="472" height="354" rx="48"
          fill="#FFFFFF" fill-opacity="0.94"
          stroke="#FFFFFF" stroke-width="34"/>
    <rect x="232" y="287" width="472" height="354" rx="48"
          fill="#FFFFFF" fill-opacity="0.94"
          stroke="#263746" stroke-width="24"/>
    <path d="M 244 365 H 692"
          stroke="#263746" stroke-width="20" stroke-linecap="round"/>
    <circle cx="286" cy="327" r="12" fill="#93B023"/>
    <circle cx="326" cy="327" r="12" fill="#D6A52D"/>
    <circle cx="366" cy="327" r="12" fill="#2D80C3"/>
  </g>

  <!-- Vector-tile map -->
  <g clip-path="url(#mapClip)">
    <!-- Tile grid -->
    <rect x="258" y="388" width="418" height="228" fill="#F7FAF5"/>
    <path d="M 467 388 V 616 M 258 502 H 676"
          stroke="#9AAA9D" stroke-width="8" opacity="0.48"/>

    <!-- Area symbology -->
    <path d="M 281 420
             C 320 401, 353 412, 378 441
             L 395 474
             C 374 492, 342 498, 312 486
             L 279 463 Z"
          fill="#B9D77B" fill-opacity="0.82"
          stroke="#5E963A" stroke-width="9" stroke-linejoin="round"/>

    <path d="M 505 520
             C 547 500, 598 511, 633 543
             L 668 581
             L 668 616
             L 512 616
             C 496 588, 492 551, 505 520 Z"
          fill="#DCE8B4" fill-opacity="0.95"
          stroke="#79A94C" stroke-width="9" stroke-linejoin="round"/>

    <!-- River / line symbology -->
    <path d="M 242 563
             C 300 535, 345 557, 398 536
             S 508 471, 571 486
             S 643 532, 699 500"
          fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
    <path d="M 242 563
             C 300 535, 345 557, 398 536
             S 508 471, 571 486
             S 643 532, 699 500"
          fill="none" stroke="#2D80C3" stroke-width="17" stroke-linecap="round"/>

    <!-- Road casing and road -->
    <path d="M 286 617 L 424 487 L 529 435 L 685 420"
          fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 286 617 L 424 487 L 529 435 L 685 420"
          fill="none" stroke="#263746" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 286 617 L 424 487 L 529 435 L 685 420"
          fill="none" stroke="#E2B33A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Point symbols -->
    <g>
      <circle cx="337" cy="545" r="20" fill="#FFFFFF"/>
      <circle cx="337" cy="545" r="13" fill="#93B023"/>
      <circle cx="566" cy="552" r="20" fill="#FFFFFF"/>
      <circle cx="566" cy="552" r="13" fill="#93B023"/>
      <circle cx="604" cy="446" r="20" fill="#FFFFFF"/>
      <circle cx="604" cy="446" r="13" fill="#93B023"/>
    </g>
  </g>

  <!-- Fine keyline around map area -->
  <rect x="258" y="388" width="418" height="228" rx="18"
        fill="none" stroke="#263746" stroke-width="10" opacity="0.80"/>
</svg>
