# One-off: deletes the GitHub Releases from before the rename to QWebMap
# (tags v4.0 ... v4.8.1 and their -hu editions, titles without "QWebMap").
# The git tags stay. Run it from the Actions tab: first with "dry_run" on to
# see the list, then with it off and "confirm" set to DELETE.
name: Delete pre-QWebMap releases

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be deleted"
        type: boolean
        default: true
      confirm:
        description: "Type DELETE to delete (needed when dry_run is off)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases older than 4.9.0 without QWebMap in the title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" != "true" ] && [ "${CONFIRM}" != "DELETE" ]; then
            echo "::error::Set confirm to DELETE (or turn dry_run on)."; exit 1
          fi
          gh api --paginate "repos/${REPO}/releases?per_page=100" \
            --jq '.[] | [.id, .tag_name, .name] | @tsv' > releases.tsv
          count=0
          while IFS=$'\t' read -r id tag title; do
            # Older than 4.9.0 by its tag, and not titled QWebMap: both must hold.
            version="${tag#v}"; version="${version%-hu}"
            if [ "$(printf '%s\n%s\n' "${version}" "4.9.0" | sort -V | head -1)" = "4.9.0" ]; then
              continue
            fi
            if echo "${title}" | grep -qi qwebmap; then
              continue
            fi
            count=$((count + 1))
            if [ "${DRY_RUN}" = "true" ]; then
              echo "would delete: ${tag}  (${title})"
            else
              gh api -X DELETE "repos/${REPO}/releases/${id}"
              echo "deleted: ${tag}  (${title})"
            fi
          done < releases.tsv
          echo "${count} release(s)$([ "${DRY_RUN}" = "true" ] && echo ' would be') deleted; tags kept."
